plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.lombok' version '2.1.20'
    id 'io.freefair.lombok' version "9.2.0"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${minecraft_version}"
}

repositories {
    // maven-central mirror: repo.maven.apache.org is rate-limited (429) from this network
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    mavenLocal()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

configurations {
    localImplementation
    runtimeClasspath.extendsFrom localImplementation
    compileOnly.extendsFrom localImplementation
}

loom {
    // Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        // Runs the fabric-gametest entrypoints declared in fabric.mod.json (the tests live in
        // src/main, so loom's fabricApi.configureTests() gametest source set does not apply) and
        // exits the server with a status code when they finish. Task: runGameTestServer.
        gameTestServer {
            inherit server
            name "Game Test Server"
            property 'fabric-api.gametest', 'true'
            runDir 'build/run/gameTest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}"

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // LDLib2 (fabric port, vendored jar — see gradle.properties for provenance) and the same
    // libraries it builds against: architectury FluidStack API + taffy UI layout engine.
    modImplementation files(project.ldlib2_fabric_jar)
    modImplementation "curse.maven:architectury-api-419699:5786326"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_language_kotlin_version}"
    // taffy/yoga ride inside the LDLib2 jar (it includes them as nested jars), so they are
    // compile/runtime deps here only — no second `include`, or the same nested jar ships twice.
    implementation "dev.vfyjxf:taffy:1.1.4"
    implementation "org.appliedenergistics.yoga:yoga:1.0.0"

    // JUnit 5 (src/test/java unit tests)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

test {
    useJUnitPlatform()
    // These unit tests construct a BlueprintGraph, which triggers LDLib2's node-registry auto-scan
    // (ReflectionUtils.findAnnotationClasses -> FabricLoader scan data only exists under the fabric
    // mod environment, not a plain JUnit run). The same blueprint behavior is covered by the
    // GameTests, so these are excluded to keep `test` green.
    exclude '**/AnnotatedNodeRegistrationTest*'
    exclude '**/ConfigurableIntegrationTest*'
    exclude '**/ExecSessionTest*'
    exclude '**/GraphExecutorTest*'
    exclude '**/WirePortalTest*'
}

sourceSets.main.kotlin {
    srcDir("src/main/java")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        freeCompilerArgs.add("-Xcontext-parameters")
        freeCompilerArgs.add("-Xwhen-guards")
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            "minecraft_version": minecraft_version,
            "loader_version"   : loader_version,
            "fabric_version"   : fabric_version,
            "mod_id"           : mod_id,
            "mod_name"         : mod_name,
            "mod_license"      : mod_license,
            "mod_version"      : mod_version,
            "mod_authors"      : mod_authors,
            "mod_description"  : mod_description,
            "mod_url"          : mod_url,
            "ldlib2_version_range": ldlib2_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
